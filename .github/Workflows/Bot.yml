name: Crypto News Bot 24/7
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install requests feedparser
      - name: Run bot
        run: python crypto_news_bot.py
